<style>
:root{color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--from,#f59e0b);overflow:hidden}
body{display:grid;place-items:center;position:relative}

/* Layer 5 màu lạnh bên góc 90 độ */
.cool-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  opacity: 0;
  visibility: hidden; /* Dùng visibility kết hợp opacity thay cho display:none để chạy được animation */
  background:
    radial-gradient(circle at 100% 0%, var(--g5) 0%, var(--g4) 20%, var(--g3) 40%, var(--g2) 60%, var(--g1) 80%, transparent 100%),
    var(--gbase,#060b19);
  background-size: 160% 160%;
  animation: dynamicFlow 6s ease-in-out infinite alternate;
}

.cool-bg.on{opacity:1;visibility:visible}

@keyframes dynamicFlow {
  0% { background-position: 100% 0%; }
  100% { background-position: 85% 15%; }
}

/* 
  KỊCH BẢN CHUYỂN ĐỘT NGỘT:
  - 0s -> 3.8s : Giữ nguyên nền vàng ấm
  - Đúng 3.8s : Bật đột ngột sang nền màu lạnh ngay tức thì nhờ step-end
*/
@keyframes showCoolBgStep {
  to {
    opacity: 1;
    visibility: visible;
  }
}

svg{width:min(92vw,980px);height:auto;display:block;overflow:visible;shape-rendering:geometricPrecision;position:relative;z-index:1}

/* Laser-drawn X */
.gp{fill:var(--ink,#fff);fill-opacity:0;stroke:var(--ink,#fff);stroke-width:2.4;stroke-linejoin:round;stroke-dasharray:1 2;stroke-dashoffset:1}
.head{fill:none;stroke:var(--ink,#fff);stroke-width:12;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:.012 2;stroke-dashoffset:.012;opacity:0}
.play .gp{animation:draw 1.5s .3s cubic-bezier(.65,0,.35,1) forwards,fillin .5s 1.7s ease forwards}
.play .head{animation:head 1.5s .3s cubic-bezier(.65,0,.35,1) forwards}
.glow{opacity:0}
.play .glow{animation:glow 3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1;stroke-opacity:0}}
@keyframes head{0%{opacity:1;stroke-dashoffset:.012}98%{opacity:1}100%{opacity:0;stroke-dashoffset:-.988}}
@keyframes glow{0%{opacity:.85}60%{opacity:1}75%{opacity:.7}100%{opacity:.3}}

/* Letters */
.t{fill:none;stroke:var(--ink,#fff);stroke-width:5.8}
.f{fill:var(--ink,#fff)}
.L{opacity:1}

/* Màn hình cuối: nền đen + chữ Coming soon... ở giữa */
.end{
  position:fixed;inset:0;z-index:10;background:#000;
  display:grid;place-items:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .6s ease, visibility 0s linear .6s;
}
.end.show{opacity:1;visibility:visible;transition:opacity 1.2s ease, visibility 0s}
.end span{
  font-family:'Google Sans','Google Sans Flex','Product Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-weight:700;color:#fff;letter-spacing:.08em;text-transform:uppercase;text-align:center;
  font-size:clamp(28px,6vw,72px);
  transform:translateY(8px);opacity:0;
  transition:transform 1.2s ease .3s, opacity 1.2s ease .3s;
}
.end.show span{transform:none;opacity:1}
</style>
</head>

const COOL_AT=3800;   // ms: lúc nền đổi sang màu thứ hai
const END_DELAY=5500; // ms: sau khi intro chạy xong thì hiện COMING SOON...
const LOOP_DELAY=5000;// ms: COMING SOON... hiển thị bao lâu thì lặp lại
// Mỗi vòng một cặp màu: from (nền đầu) -> g (nền gradient sau khi đổi). ink = màu logo.
const THEMES=[
 {name:'Vàng → Xanh dương', from:'#f59e0b',ink:'#fff',   g:['#06b6d4','#0284c7','#2563eb','#1d4ed8','#1e3a8a'],base:'#050a1f',toInk:'#fff'},
 {name:'Xanh dương → Tím',  from:'#2563eb',ink:'#fff',   g:['#a78bfa','#8b5cf6','#7c3aed','#6d28d9','#4c1d95'],base:'#0d0620',toInk:'#fff'},
 {name:'Tím → Đen',         from:'#7c3aed',ink:'#fff',   g:['#18181b','#27272a','#3f3f46','#52525b','#71717a'],base:'#000000',toInk:'#fff'},
 {name:'Hồng → Cam',        from:'#ec4899',ink:'#fff',   g:['#fdba74','#fb923c','#f97316','#ea580c','#c2410c'],base:'#1c0a02',toInk:'#fff'},
 {name:'Xanh lá → Be',      from:'#22c55e',ink:'#fff',   g:['#f5ebd7','#efe0c4','#e8d5b0','#dcc59a','#cfb185'],base:'#e9dcc2',toInk:'#2b2118'},
 {name:'Be → Đỏ',           from:'#e8d9b8',ink:'#2b2118',g:['#fb7185','#ef4444','#dc2626','#b91c1c','#7f1d1d'],base:'#1a0505',toInk:'#fff'},
 {name:'Đỏ → Xanh ngọc',    from:'#dc2626',ink:'#fff',   g:['#5eead4','#2dd4bf','#14b8a6','#0d9488','#115e59'],base:'#021412',toInk:'#fff'},
 {name:'Xanh ngọc → Vàng',  from:'#14b8a6',ink:'#fff',   g:['#fef08a','#fde047','#facc15','#eab308','#ca8a04'],base:'#2a2000',toInk:'#2a1f00'}
];
let ti=0,coolTimer,endTimer,loopTimer;
function play(advance){
  clearTimeout(coolTimer);clearTimeout(endTimer);clearTimeout(loopTimer);
  if(advance===true)ti=(ti+1)%THEMES.length;
  const th=THEMES[ti];
  root.style.setProperty('--from',th.from);
  root.style.setProperty('--ink',th.ink);
  th.g.forEach((c,k)=>root.style.setProperty('--g'+(k+1),c));
  root.style.setProperty('--gbase',th.base);
  coolEl.classList.remove('on');
  svg.classList.remove('play');
  endEl.classList.remove('show');
  void svg.getBoundingClientRect();
  svg.classList.add('play');
  coolTimer=setTimeout(()=>{coolEl.classList.add('on');root.style.setProperty('--ink',th.toInk)},COOL_AT);
  endTimer=setTimeout(()=>{
    endEl.classList.add('show');
    loopTimer=setTimeout(()=>play(true),LOOP_DELAY);
  },END_DELAY);
}
document.addEventListener('click',e=>{if(e.button===0)play()});
play();
</script>
</body>
</html>
